<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte — Curated.football</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f0ede9;--white:#fff;--border:#e0dbd4;--text:#141210;--dim:#4a4845;--muted:#9a9590;--gold:#b8954a}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
    nav{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--border);background:var(--white)}
    .logo{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--text);text-decoration:none}
    .tld{font-family:'IBM Plex Mono',monospace;font-size:.55em;font-weight:400;color:var(--gold)}
    .btn-logout{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--border);color:var(--muted);padding:9px 18px;cursor:pointer;transition:all .2s}
    .btn-logout:hover{border-color:var(--text);color:var(--text)}

    .page{max-width:720px;margin:0 auto;padding:48px 24px}
    .page-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;margin-bottom:40px}

    .card{background:var(--white);border:1px solid var(--border);padding:32px;margin-bottom:16px}
    .card-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
    .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
    .info-row:last-child{border-bottom:none}
    .info-key{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--muted)}
    .info-val{font-size:14px;font-weight:500;color:var(--text)}

    .empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
    .btn-browse{display:inline-block;margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#fff;text-decoration:none;padding:14px 28px;transition:opacity .2s}
    .btn-browse:hover{opacity:.88}

    @media(max-width:600px){nav{padding:16px 20px}.page{padding:32px 16px}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">CURATED<span class="tld">.football</span></a>
  <button class="btn-logout" onclick="logout()">Se déconnecter</button>
</nav>

<div class="page">
  <div class="page-label">Mon compte</div>
  <div class="page-title" id="welcome">Bonjour</div>

  <div class="card">
    <div class="card-label">Informations</div>
    <div class="info-row">
      <span class="info-key">Email</span>
      <span class="info-val" id="user-email">—</span>
    </div>
    <div class="info-row">
      <span class="info-key">Nom</span>
      <span class="info-val" id="user-name">—</span>
    </div>
    <div class="info-row">
      <span class="info-key">Membre depuis</span>
      <span class="info-val" id="user-since">—</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Mes achats</div>
    <div class="empty">
      Aucun achat pour l'instant.
      <br>
      <a href="catalogue.html" class="btn-browse">Parcourir le catalogue</a>
    </div>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://pwakudhbkcmsdculjypp.supabase.co',
    'sb_publishable_SULbKQTYT9Kb9U_FR-xCBA_o6wLMw04'
  );

  // Handle OAuth callback and regular session
  sb.auth.onAuthStateChange(function(event, session) {
    if (!session) {
      // Wait a moment in case OAuth code is being exchanged
      setTimeout(function() {
        sb.auth.getSession().then(function({ data: { session: s } }) {
          if (!s) window.location.href = 'login.html';
        });
      }, 1500);
      return;
    }
    var u = session.user;
    var meta = u.user_metadata || {};
    var firstName = meta.first_name || (meta.full_name || meta.name || '').split(' ')[0] || '';
    var name = meta.full_name || meta.name || ((meta.first_name || '') + ' ' + (meta.last_name || '')).trim() || u.email;
    var since = new Date(u.created_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

    document.getElementById('welcome').textContent = 'Bonjour' + (firstName ? ', ' + firstName : '') + '.';
    document.getElementById('user-email').textContent = u.email;
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-since').textContent = since;
  });

  async function logout() {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
