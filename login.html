<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Curated.football</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f0ede9;--white:#fff;--border:#e0dbd4;--text:#141210;--dim:#4a4845;--muted:#9a9590;--gold:#b8954a}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    nav{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--border);background:var(--white)}
    .logo{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--text);text-decoration:none}
    .tld{font-family:'IBM Plex Mono',monospace;font-size:.55em;font-weight:400;color:var(--gold)}
    .nav-signup{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:9px 18px;text-decoration:none;transition:all .2s}
    .nav-signup:hover{background:var(--gold);color:#fff}

    .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
    .auth-card{background:var(--white);border:1px solid var(--border);width:100%;max-width:440px;padding:48px}

    .auth-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
    .auth-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;color:var(--text);margin-bottom:8px}
    .auth-sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.6}

    .field{margin-bottom:20px}
    .field label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
    .field input{width:100%;padding:13px 16px;border:1px solid var(--border);background:transparent;font-family:'Outfit',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--gold)}

    .forgot{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--muted);text-decoration:none;display:block;text-align:right;margin-top:6px;transition:color .2s}
    .forgot:hover{color:var(--gold)}

    .btn-login{width:100%;background:var(--gold);color:#fff;border:none;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:opacity .2s;margin-top:8px}
    .btn-login:hover{opacity:.88}
    .btn-login:disabled{opacity:.5;cursor:default}

    .error-msg{font-size:13px;color:#c0392b;margin-top:12px;display:none;padding:12px 16px;background:rgba(192,57,43,.06);border:1px solid rgba(192,57,43,.2)}
    .error-msg.show{display:block}

    .auth-link{text-align:center;font-size:13px;color:var(--muted);margin-top:24px}
    .auth-link a{color:var(--gold);text-decoration:none;font-weight:500}

    @media(max-width:600px){
      nav{padding:16px 20px}
      .auth-card{padding:32px 24px}
      .auth-title{font-size:28px}
    }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">CURATED<span class="tld">.football</span></a>
  <a href="signup.html" class="nav-signup">Créer un compte</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-label">Connexion</div>
    <div class="auth-title">Bon retour.</div>
    <div class="auth-sub">Connecte-toi pour acheter ou vendre des maillots certifiés.</div>

    <div class="field">
      <label>Adresse email</label>
      <input type="email" id="email" placeholder="toi@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <a href="reset-password.html" class="forgot">Mot de passe oublié ?</a>
    </div>

    <div class="error-msg" id="err-login"></div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Se connecter</button>

    <div class="auth-link">
      Pas encore de compte ? <a href="signup.html">Créer un compte</a>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://pwakudhbkcmsdculjypp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SULbKQTYT9Kb9U_FR-xCBA_o6wLMw04';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Check if already logged in
  sb.auth.getSession().then(function({ data: { session } }) {
    if (session) {
      var params = new URLSearchParams(window.location.search);
      window.location.href = params.get('next') || 'account.html';
    }
  });

  async function doLogin() {
    var email = document.getElementById('email').value.trim();
    var pwd   = document.getElementById('password').value;
    var err   = document.getElementById('err-login');
    var btn   = document.getElementById('btn-login');

    err.classList.remove('show');
    if (!email || !pwd) { err.textContent = 'Remplis tous les champs.'; err.classList.add('show'); return; }

    btn.textContent = 'Connexion…';
    btn.disabled = true;

    var { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });

    if (error) {
      btn.textContent = 'Se connecter';
      btn.disabled = false;
      err.textContent = error.message === 'Invalid login credentials'
        ? 'Email ou mot de passe incorrect.'
        : error.message;
      err.classList.add('show');
      return;
    }

    var params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'account.html';
  }

  // Enter key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
